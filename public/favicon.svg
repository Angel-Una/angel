<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变：紫 → 品红 → 粉，蕴含爱与科技 -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <!-- 心形渐变：亮粉 → 玫红 -->
    <linearGradient id="heart" x1="128" y1="80" x2="384" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <!-- 节点高光 -->
    <radialGradient id="node" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </radialGradient>
    <!-- 顶部高光 -->
    <linearGradient id="shine" x1="256" y1="40" x2="256" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 顶部柔和高光，增加立体质感 -->
  <rect width="512" height="180" rx="112" fill="url(#shine)"/>

  <!-- 心形主体（爱） -->
  <path d="M256 432 C 110 328, 40 252, 40 168 C 40 112, 88 72, 148 72 C 188 72, 226 94, 256 128 C 286 94, 324 72, 364 72 C 424 72, 472 112, 472 168 C 472 252, 402 328, 256 432 Z"
        fill="url(#heart)" fill-opacity="0.95"/>

  <!-- 神经网络连接线（AI）：贯穿心形的节点连接 -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="180" y1="200" x2="256" y2="256"/>
    <line x1="332" y1="200" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="256" y2="344"/>
    <line x1="256" y1="256" x2="176" y2="300"/>
    <line x1="256" y1="256" x2="336" y2="300"/>
    <line x1="176" y1="300" x2="216" y2="360"/>
    <line x1="336" y1="300" x2="296" y2="360"/>
    <line x1="216" y1="360" x2="296" y2="360"/>
  </g>

  <!-- 神经网络节点（AI）：白色+青色发光圆点 -->
  <g fill="url(#node)">
    <circle cx="180" cy="200" r="14"/>
    <circle cx="332" cy="200" r="14"/>
    <circle cx="256" cy="256" r="20"/>
    <circle cx="176" cy="300" r="12"/>
    <circle cx="336" cy="300" r="12"/>
    <circle cx="216" cy="360" r="11"/>
    <circle cx="296" cy="360" r="11"/>
  </g>
</svg>
