<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 柔和浅粉背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6F8"/>
      <stop offset="1" stop-color="#FCEEF1"/>
    </linearGradient>
    <!-- 爱心描边渐变：粉 → 珊瑚 -->
    <linearGradient id="heartStroke" x1="120" y1="100" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7A8B8"/>
      <stop offset="1" stop-color="#F4A0A0"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 爱心主体：左半边完整描边，右半边由神经网络节点+连线构成 -->
  <!-- 左半边爱心轮廓 -->
  <path d="M 256 412 C 130 322, 64 258, 64 184 C 64 138, 100 104, 142 104 C 178 104, 214 124, 256 160 L 256 412 Z"
        fill="none" stroke="url(#heartStroke)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 神经网络：右半边爱心由节点 + 连线构成（AI） -->
  <g stroke="#E8A0B0" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85">
    <!-- 从顶部中央到右上 lobe -->
    <line x1="256" y1="160" x2="320" y2="128"/>
    <line x1="320" y1="128" x2="384" y2="104"/>
    <line x1="384" y1="104" x2="448" y2="138"/>
    <line x1="448" y1="138" x2="448" y2="184"/>
    <!-- 右半边向下收束到心尖 -->
    <line x1="448" y1="184" x2="420" y2="248"/>
    <line x1="420" y1="248" x2="360" y2="312"/>
    <line x1="360" y1="312" x2="296" y2="372"/>
    <line x1="296" y1="372" x2="256" y2="412"/>
    <!-- 内部交叉连接，体现神经网络互联 -->
    <line x1="256" y1="160" x2="384" y2="104"/>
    <line x1="320" y1="128" x2="448" y2="138"/>
    <line x1="448" y1="184" x2="360" y2="312"/>
    <line x1="420" y1="248" x2="256" y2="412"/>
  </g>

  <!-- 神经网络节点（圆润实心点） -->
  <g fill="#F0A8B8">
    <circle cx="256" cy="160" r="16"/>
    <circle cx="320" cy="128" r="14"/>
    <circle cx="384" cy="104" r="14"/>
    <circle cx="448" cy="138" r="14"/>
    <circle cx="448" cy="184" r="14"/>
    <circle cx="420" cy="248" r="12"/>
    <circle cx="360" cy="312" r="12"/>
    <circle cx="296" cy="372" r="12"/>
    <circle cx="256" cy="412" r="16"/>
  </g>
</svg>
